# Settings shared by every off-site host that routes its default route through
# OPNsense over WireGuard.
#
# The per-host half of the tunnel - address, keys, endpoint - lives in
# host_vars/<name>.yml, because it comes out of the peer you register on
# OPNsense for that host. See docs/wireguard.md.

# The public ingest hostname, same as group_vars/vps.yml and for the same
# reason: a [vpn] host is an isolated point-to-point peer, not an extension of
# the LAN, so ingest.net.d1023.de (LAN and tunnel only) is not reachable from
# here - OPNsense has no route from this peer to the home LAN. The public name
# is reachable because OPNsense NATs this peer's traffic out its own WAN like
# any other internet-bound connection.
#
# The Alloy play runs after the tunnel is up and fetches its release from
# GitHub through it, so this also depends on OPNsense's outbound NAT actually
# covering the tunnel subnet, and on a WAN-interface firewall rule permitting
# this peer's traffic out - see docs/wireguard.md.
alloy_ingest_base: "https://ingest.d1023.de"

# Loose reverse path filtering. Strict (the role default of 1) drops inbound
# SSH on the public interface as soon as the default route is the tunnel: the
# kernel looks for a route back to that source, finds it points down wg0, and
# discards the packet before any firewall rule is consulted. The kill switch's
# careful work on replies never gets the chance to matter.
#
# This is a kernel-level relaxation and it is real: loose mode accepts a packet
# from any source the host has *some* route to, which with a 0.0.0.0/0 tunnel
# is everything. Anti-spoofing on these hosts is the firewall's job instead.
sysctl_rp_filter: 2
