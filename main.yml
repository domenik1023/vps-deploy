- name: Basic VPS Hardening with SSH Key Only and Custom Port
  # The [lapi] group is only there as a delegation target for CrowdSec
  # credential provisioning; hardening it would disable the central LAPI.
  hosts: all:!lapi
  become: true

  # A `roles:` list rather than a series of include_role tasks, and that is
  # load-bearing in two ways that a task-level include cannot give us.
  #
  # Handlers. `Reload UFW` lives in roles/baseline and notifies `Restart
  # CrowdSec bouncer` and `Restart WireGuard kill switch`, which live in the
  # two roles below it. Handlers are shared across every role in a play, but a
  # dynamic include_role only registers its handlers when it actually runs - so
  # `--tags ssh` on a host that changes a ufw rule would notify a handler that
  # was never registered and kill the run. A `roles:` entry is static: the
  # handlers exist whether or not the tag selects the tasks.
  #
  # Order. Handlers fire in definition order, not notification order, and role
  # order is what sets it. baseline first means `Reload systemd`, `Restart
  # Docker` and `Reload UFW` are all defined before the two restarts `Reload
  # UFW` notifies. Swapping these three lines breaks that silently.
  #
  # The task order inside each role is a statement about that role; the order
  # of the roles themselves carries the rest of it:
  #
  #   baseline    installs python3-debian (deb822_repository needs it) and
  #               starts Docker (crowdsec probes DOCKER-USER), and moves sshd
  #   crowdsec    agent + bouncer, [vps] and [vpn] only
  #   wireguard   last, so every apt install above has already happened over
  #               the direct connection before the default route moves into
  #               the tunnel
  #
  # Each of the two gated roles carries its own `when` on one include inside
  # itself rather than a `when` here, so a host that is not in the class
  # reports one skipped task instead of every task in the role.
  roles:
    - role: baseline

    - role: crowdsec
      tags: [crowdsec]

    - role: wireguard
      tags: [wireguard]

# A second play rather than a fourth role above, so the hardening role's
# load-bearing task order stays a statement about itself.
#
# Two things make the split safe. 42_ssh.yml moves sshd mid-play and records
# the new port with set_fact; host facts persist across plays within a run, so
# this play connects on the right port even on a bootstrap run. And it has to
# come after 62_docker.yml, because cAdvisor and the Docker log discovery both
# expect the Docker socket to already be there.
#
# It also has to stay after roles/wireguard: a [vpn] host fetches the Alloy
# release through the tunnel, and group_vars/vpn.yml points it at the public
# ingest name for the same reason.
- name: Deploy the Grafana Alloy telemetry agent
  # Same targeting as above, for the same reason: the LAPI host is a delegation
  # target, not a machine this playbook configures.
  hosts: all:!lapi
  become: true
  tasks:
    - name: Include Alloy role
      ansible.builtin.include_role:
        name: alloy
