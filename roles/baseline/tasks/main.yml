# The include order is load-bearing, and the file names are numbered so that it
# is visible in `ls` rather than only in this comment. Each edge below is a
# constraint someone has already been bitten by; the file that depends on one
# repeats it at its own top.
#
#   00 classify    fails the run before anything changes if this host is not in
#                  exactly one of [local], [vps] and [vpn]
#   10 hostname    the host's own name is what everything after it records
#                  itself as, and the Alloy play labels all of its telemetry
#                  with it
#   20 user        the admin account must have sudo before 42_ssh.yml locks
#                  root out
#   30 packages    installs python3-debian, which deb822_repository in
#                  62_docker.yml and roles/crowdsec both need
#   40 firewall    the bootstrap allow and the limit on the new SSH port must
#                  exist before 42 moves sshd
#   42 ssh         moves sshd mid-play and records the new port with set_fact
#   62 docker      starts Docker before roles/crowdsec probes for DOCKER-USER
#
# CrowdSec and WireGuard used to be 70 and 80 here. They are roles/crowdsec and
# roles/wireguard now, listed after this role in main.yml, and the ordering
# constraints they had inside this file are the same ones that fix their role
# order: CrowdSec needs python3-debian and a running Docker, and WireGuard has
# to be last so every apt install happens before the default route moves into
# the tunnel.
#
# The tags are for re-running one concern against an already-converged host.
# They are not a bootstrap tool: `--tags crowdsec` on a fresh box skips
# 42_ssh.yml, so the set_fact that moves ansible_port never runs and every task
# after it tries the wrong port.

- name: Include host classification checks
  ansible.builtin.include_tasks:
    file: 00_classify.yml
  tags: [always]

- name: Include hostname tasks
  ansible.builtin.include_tasks:
    file: 10_hostname.yml
  tags: [hostname]

- name: Include user tasks
  ansible.builtin.include_tasks:
    file: 20_user.yml
  tags: [user]

- name: Include package tasks
  ansible.builtin.include_tasks:
    file: 30_packages.yml
  tags: [packages]

- name: Include firewall tasks
  ansible.builtin.include_tasks:
    file: 40_firewall.yml
  tags: [firewall]

- name: Include fail2ban tasks
  ansible.builtin.include_tasks:
    file: 41_fail2ban.yml
  tags: [fail2ban]

- name: Include SSH hardening tasks
  ansible.builtin.include_tasks:
    file: 42_ssh.yml
  tags: [ssh]

- name: Include sysctl kernel hardening tasks
  ansible.builtin.include_tasks:
    file: 50_sysctl.yml
  tags: [sysctl]

- name: Include unattended upgrade tasks
  ansible.builtin.include_tasks:
    file: 60_updates.yml
  tags: [updates]

- name: Include time synchronisation tasks
  ansible.builtin.include_tasks:
    file: 61_time.yml
  tags: [time]

- name: Include Docker tasks
  ansible.builtin.include_tasks:
    file: 62_docker.yml
  tags: [docker]
