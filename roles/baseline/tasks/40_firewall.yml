# --- UFW ---
# Strictly before 42_ssh.yml. The bootstrap allow on the port the live Ansible
# session is using, and the `limit` on the port sshd is about to move to, must
# both exist before that file restarts sshd. The matching deny on the old port
# lives there rather than here, next to the move that justifies it.

# Open the port the active Ansible SSH session is using BEFORE enabling UFW.
# Without this, `ufw enable` activates default-deny incoming and instantly
# drops the live session, leaving the host unreachable mid-play.
#
# Use `allow` (not `limit`) — UFW's limit rule rejects with
# icmp-port-unreachable once >6 new connections hit in 30s, which Ansible
# trips easily by reconnecting per task. The new ssh_port still gets
# `limit` below for production protection.
- name: Allow current SSH port in UFW (bootstrap, prevents lockout)
  community.general.ufw:
    rule: allow
    port: "{{ ansible_port | default(22) }}"
    proto: tcp

# Rate-limit the custom SSH port (blocks IPs exceeding 6 connections/30s at the kernel level)
- name: Rate-limit custom SSH port in UFW
  community.general.ufw:
    rule: limit
    port: "{{ ssh_port }}"
    proto: tcp

# Logging is set explicitly rather than left to UFW's default, but it is there
# to be read by hand - CrowdSec does not consume it. ufw rate-limits its own LOG
# rules below loglevel `high`, so crowdsec.yml installs a separate unthrottled
# rule for the port-scan scenario. See ufw_logging in the role defaults.
- name: Enable UFW
  community.general.ufw:
    state: enabled
    logging: "{{ ufw_logging }}"

# Host-specific allow rules, for things UFW's default-deny would otherwise drop
# on the way in. The case this exists for is a container reaching a service the
# host binds on the Docker bridge gateway: that traffic arrives on the bridge
# interface and traverses INPUT, so Docker's own FORWARD rules never see it and
# UFW drops it.
#
# These live here rather than in the role that wants them, and that is not
# arbitrary. Any rule change reloads UFW, `ufw reload` is a stop/start that
# deletes every non-builtin chain, and that takes the CrowdSec bouncer's rules
# with it. The `Reload UFW` handler puts them back by notifying the bouncer
# restart - and handlers are only reachable from the role that defines them, so
# a ufw task in roles/alloy could not notify it.
#
# Scope each rule as tightly as it will go. `to` and `port` in particular:
# without them a rule opens the address on every port.
# Lets a container reach a service on the host by its address, which UFW's
# default-deny otherwise drops on the way into INPUT. See
# docker_host_access_cidrs in defaults/main/20_firewall.yml for why it is not
# an entry in ufw_allow_rules.
#
# proto: any, because the point is "the host is reachable from the bridge" -
# a rule limited to tcp leaves DNS and anything else on udp still dropped, and
# the symptom is the same confusing timeout.
- name: Allow Docker bridge networks to reach host services
  community.general.ufw:
    rule: allow
    src: "{{ item }}"
    proto: any
    comment: "Docker containers to host-bound services"
  loop: "{{ docker_host_access_cidrs }}"
  notify: Reload UFW

- name: Apply host-specific UFW allow rules
  community.general.ufw:
    rule: allow
    src: "{{ item.src | default(omit) }}"
    dest: "{{ item.dest | default(omit) }}"
    port: "{{ item.port | default(omit) }}"
    proto: "{{ item.proto | default('tcp') }}"
    comment: "{{ item.comment | default(omit) }}"
  loop: "{{ ufw_allow_rules }}"
  loop_control:
    label: "{{ item.comment | default(item.port | default(item.src)) }}"
  notify: Reload UFW
