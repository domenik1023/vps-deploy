# --- WireGuard ---
# Applied to [vpn] hosts only; wireguard_manage in 00_identity.yml is what
# gates it. These boxes are rented off-site but belong to the LAN: the default
# route is the tunnel, and the kill switch means a tunnel that drops takes the
# host's internet with it rather than quietly falling back to the VPS's own
# public address.
#
# The per-host half - address, keys, endpoint - comes out of the client config
# the UniFi WireGuard server generates. See docs/wireguard.md; there is no API
# to automate that side.

wg_interface: wg0

# Full tunnel. Anything narrower makes the kill switch a lie: traffic outside
# the AllowedIPs would have no tunnel to take and would be dropped rather than
# routed, which looks exactly like a broken tunnel.
wg_allowed_ips:
  - "0.0.0.0/0"

# The UDM is behind a home connection, so the host has to keep the mapping
# open from its side. 25s is the WireGuard default recommendation and is below
# every common NAT timeout.
wg_persistent_keepalive: 25

# 1420 = 1500 - 80 for the WireGuard header over IPv4. Lower it if the VPS's
# own link is not 1500 (some providers hand out 1450 on a virtual NIC), or TCP
# through the tunnel stalls on large packets while ping stays fine.
wg_mtu: 1420

# The interface the public address is on. Left empty to be derived, by finding
# the interface whose IPv4 address is ansible_host.
#
# Deliberately NOT ansible_facts['default_ipv4']['interface']: that is correct
# exactly once, on the run that builds the tunnel, and reports wg0 on every run
# afterwards - at which point the kill switch would be told to block the
# tunnel and let the public interface through, which is the whole thing
# backwards. Pin it here or in host_vars if the VPS reaches the internet
# through provider NAT, where the public address is not on any local interface.
wg_wan_interface: ""

# Generate the private key on the host instead of taking wg_private_key from
# the vault, and print the public key to paste into the server. Only useful if
# your UniFi version lets you enter a client public key; the versions that
# generate the keypair for you leave nothing for this to do.
wg_generate_key: false

# --- Kill switch ---
# Nothing leaves the public interface except the tunnel itself and the few
# exceptions below. Container traffic is covered too, in DOCKER-USER, because
# Docker's FORWARD jumps run ahead of ufw's and ufw-before-forward never sees
# it.
wg_killswitch: true

# The connmark bit that means "this connection came in on the public interface,
# so its replies go back out of it". Set on inbound packets, restored onto
# outbound ones, and matched by an `ip rule` that sends those to the main
# routing table instead of the tunnel.
#
# A single bit, used as both value and mask, and that matters: wg-quick sets
# its own fwmark on the encrypted packets it sends, and an unmasked
# `CONNMARK --restore-mark` would overwrite it - which routes the tunnel's own
# packets back into the tunnel. Masked to one bit, the two coexist.
#
# It is not wg-quick's fwmark and must not be set to it. wg-quick picks that
# value at runtime (the first free routing table from 51820 up) and overrides
# whatever FwMark the config file asks for, so it is not a number this repo can
# know.
wg_killswitch_mark: "0x40000"

# Priority of the `ip rule` that acts on that mark. Must be below wg-quick's
# own rules, which it installs at 32764 and 32765, or the tunnel's default
# route wins and marked replies never reach the public interface.
wg_killswitch_rule_priority: 30000

# Let DNS out of the public interface even when the tunnel is down.
#
# Worth understanding before turning it off: a wg_peer_endpoint that is a DNS
# name has to be resolved before the tunnel can come up, and with the tunnel
# down the only resolver the host can reach is out there. Blocking it means the
# tunnel can never recover on its own. An endpoint written as a bare IP address
# does not have this problem, and is the only case where turning this off is
# safe.
wg_killswitch_allow_dns: true

# Extra iptables match specifications allowed out of the public interface, each
# appended to the kill switch's OUTPUT chain ahead of its final DROP. Written
# as raw iptables arguments, e.g.
#
#   wg_killswitch_extra_allow:
#     - "-p tcp --dport 443 -d 203.0.113.10"
#
# Scope every entry. An unscoped one is a hole in the only thing keeping this
# host's traffic inside the tunnel.
wg_killswitch_extra_allow: []

# How long the automatic rollback waits before undoing the tunnel and the kill
# switch, if the play does not get far enough to cancel it. It is armed before
# the default route moves and cancelled once the host has been confirmed
# reachable, so it only ever fires on a run that locked itself out.
wg_rollback_delay: 5min
