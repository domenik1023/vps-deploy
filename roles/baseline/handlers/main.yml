# Handlers fire in the order they are defined here, not the order they are
# notified, so the daemon-reload has to come before any service it affects.
#
# That order now spans roles. Handlers from every role in the play share one
# namespace and fire in role order, so main.yml listing baseline before
# crowdsec and wireguard is what keeps `Reload UFW` ahead of the two restarts
# it notifies. Reordering the roles there would break this file silently.
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart Docker
  ansible.builtin.service:
    name: docker
    state: restarted

# `ufw reload` is a stop/start: it flushes the built-in chains and deletes every
# non-builtin one, which takes the CrowdSec bouncer's rules and the WireGuard
# kill switch's chains with it. So it has to be defined ahead of the handlers
# that put them back, and it has to notify them itself - a run that only
# touched before.rules would otherwise leave the host unprotected until the
# next bouncer or kill switch restart.
#
# Both targets live in other roles now (roles/crowdsec and roles/wireguard).
# That works because they are in the same play, and it is why they are in the
# same play: a handler cannot notify one that is not in the play at all, which
# is also why `ufw_allow_rules` stays in this role rather than moving to
# whichever role wants a port opened.
- name: Reload UFW
  community.general.ufw:
    state: reloaded
  notify:
    - Restart CrowdSec bouncer
    - Restart WireGuard kill switch
