# --- WireGuard ---
# Applied to [vpn] hosts only; wireguard_manage in 00_identity.yml is what
# gates it. These boxes are rented off-site and route their entire default
# route through OPNsense rather than their own public address: the kill switch
# means a tunnel that drops takes the host's internet with it rather than
# quietly falling back to the VPS's own public address.
#
# This is not an extension of the LAN. OPNsense treats each [vpn] host as an
# isolated point-to-point peer - it reaches OPNsense and nothing past it.
#
# The per-host half - address, keys, endpoint - comes from the peer you create
# on OPNsense (VPN: WireGuard: Peers). See docs/wireguard.md. OPNsense has a
# real REST API, unlike the UniFi server this used to point at, but this
# playbook does not call it - the peer is registered once, by hand or with a
# short API call, and this playbook never touches the server side after that.

wg_interface: wg0

# Full tunnel. Anything narrower makes the kill switch a lie: traffic outside
# the AllowedIPs would have no tunnel to take and would be dropped rather than
# routed, which looks exactly like a broken tunnel.
wg_allowed_ips:
  - "0.0.0.0/0"

# OPNsense may be behind a connection that NATs it too, so the host has to
# keep the mapping open from its side. 25s is the WireGuard default
# recommendation and is below every common NAT timeout.
wg_persistent_keepalive: 25

# 1420 = 1500 - 80 for the WireGuard header over IPv4. Lower it if the VPS's
# own link is not 1500 (some providers hand out 1450 on a virtual NIC), or TCP
# through the tunnel stalls on large packets while ping stays fine.
wg_mtu: 1420

# Clamp the TCP MSS of *forwarded* traffic to the tunnel's path MTU.
#
# This is what makes Docker containers work on a [vpn] host, and without it
# they look broken in a way that does not resemble an MTU problem at all:
# handshakes complete, ping works, DNS works, and every transfer larger than
# one segment hangs. `docker pull`, `apt update` and any HTTPS with a real
# certificate chain stall forever.
#
# The host's own traffic is fine without this. The kernel sizes the MSS it
# advertises from the outgoing route's MTU, and with AllowedIPs = 0.0.0.0/0
# that route is {{ wg_interface }} - so the host asks for 1380 by itself. A
# container cannot: it sits on a 1500-MTU bridge, advertises MSS 1460 from
# that, and the kernel never rewrites the MSS of traffic it merely forwards.
# Routers are not supposed to.
#
# The two directions then fail differently, and only one recovers on its own:
#
#   container -> internet   self-heals. The oversized frame hits this host,
#                           does not fit wg0, and this host drops it and sends
#                           ICMP frag-needed straight back down the veth. Same
#                           kernel, no middlebox, container caches the PMTU.
#
#   internet -> container   black-holes. The remote is sending 1460-byte
#                           segments because our container asked for them.
#                           Those die at OPNsense, which has to push them into
#                           the tunnel and cannot, and the ICMP saying so has
#                           to cross the public internet back to the remote -
#                           where it is filtered often enough to be useless.
#                           Nothing ever tells the container to ask for less.
#
# Rewriting the MSS option on the SYN as it *leaves* the tunnel is what fixes
# the second one: the option means "do not send me more than this", so the
# remote never emits a packet OPNsense cannot carry. --clamp-mss-to-pmtu
# rather than a literal --set-mss so it tracks wg_mtu above, including on a
# host whose provider hands out a 1450-byte underlay.
#
# Installed by the kill switch script, because that is the thing here that is
# already idempotent, already covers both address families, and is already put
# back by the Reload UFW handler - and `ufw reload` flushes the mangle builtin
# this rule lives in just as it flushes the ones the kill switch jumps from.
# That does mean wg_killswitch: false leaves a [vpn] host with no clamp; if you
# ever run one that way, this needs a unit of its own.
wg_mss_clamp: true

# The package providing the `resolvconf` command, installed only when wg_dns
# is set. Empty to install nothing and let the assert in tasks/tunnel.yml stop
# the run instead.
#
# wg-quick applies `DNS =` by piping into `resolvconf` and does nothing else if
# it is missing - it fails, and the interface never comes up. A minimal cloud
# image can have no provider at all, which is a stop three tasks before the
# tunnel for something one apt install fixes.
#
# systemd-resolved rather than openresolv, and the reason is not just that it
# is the Ubuntu-native stack: on 24.04 it is the only package that `Provides:
# resolvconf`, and it ships /usr/sbin/resolvconf as a symlink to resolvectl -
# so wg-quick's DNS ends up scoped to the tunnel interface, which is what a
# full-tunnel host wants, rather than rewritten globally into /etc/resolv.conf.
#
# Worth knowing before changing it: installing systemd-resolved takes over
# /etc/resolv.conf (a symlink to its stub). On a host already managing that
# file another way - a static file, cloud-init, the old resolvconf package -
# that is a real change to how the host resolves names, and a host that loses
# DNS mid-run fails the apt work and the Alloy play after it. Set this to
# openresolv where that applies, or to "" to keep the old behaviour of
# stopping and letting someone decide by hand.
wg_resolvconf_package: systemd-resolved

# The interface this host reaches the internet on. Empty to derive it, from
# the default route in the main routing table.
#
# Main is the right table because wg-quick does not touch it: with
# AllowedIPs = 0.0.0.0/0 the tunnel's default route goes in a table of its own,
# reached by an `ip rule`. So main names the public interface whether the
# tunnel is up or not.
#
# Note this is the interface, not the address, and on a NAT'd host the two
# disagree: an OpenStack floating IP lives on a router, and the VM sees only a
# private address. The kill switch cares about the interface, so that is fine -
# but it is why this cannot be derived from ansible_host.
#
# Set it here or in host_vars for a host with more than one default route,
# where picking the first is a coin toss rather than an answer.
wg_wan_interface: ""

# Generate the keypair on the host instead of taking wg_private_key from the
# vault, and print the public half to register on the server.
#
# OPNsense never hands out a client private key - a peer entry only ever holds
# the client's public key - so this is the only shape that applies and every
# OPNsense-backed [vpn] host sets it true. It is also the better shape on its
# own terms: the private key is generated on the host that uses it and never
# travels.
#
# The run that mints the key stops right after printing it, because the server
# cannot know it yet and everything below would fail at the handshake check
# after moving the default route. Register the key, run again, and the second
# pass continues with the same key - `wg genkey` is guarded by `creates:`.
wg_generate_key: false

# --- Kill switch ---
# Nothing leaves the public interface except the tunnel itself and the few
# exceptions below. Container traffic is covered too, in DOCKER-USER, because
# Docker's FORWARD jumps run ahead of ufw's and ufw-before-forward never sees
# it.
wg_killswitch: true

# The connmark bit that means "this connection came in on the public interface,
# so its replies go back out of it". Set on inbound packets, restored onto
# outbound ones, and matched by an `ip rule` that sends those to the main
# routing table instead of the tunnel.
#
# A single bit, used as both value and mask, and that matters: wg-quick sets
# its own fwmark on the encrypted packets it sends, and an unmasked
# `CONNMARK --restore-mark` would overwrite it - which routes the tunnel's own
# packets back into the tunnel. Masked to one bit, the two coexist.
#
# It is not wg-quick's fwmark and must not be set to it. wg-quick picks that
# value at runtime (the first free routing table from 51820 up) and overrides
# whatever FwMark the config file asks for, so it is not a number this repo can
# know.
wg_killswitch_mark: "0x40000"

# Priority of the `ip rule` that acts on that mark. Must be below (checked
# before) wg-quick's own rules - or the tunnel's default route wins and
# marked replies never reach the public interface, which looks exactly like a
# working kill switch that quietly isn't.
#
# wg-quick does NOT reliably install those at 32764/32765. That was this
# repo's original assumption, from upstream's documented default - but a real
# deployment (vpn-gwdg-01) showed wg-quick installing them at 29998/29999
# instead, which sits *above* the old default of 30000 and silently defeated
# the whole mechanism: packets were correctly marked and restored (confirmed
# with `iptables -t mangle -L -n -v`, nonzero counters on both chains) and
# still went into the tunnel, because ip rule evaluates lowest-number-first
# and wg-quick's rule won the race. There is no fixed number wg-quick is
# guaranteed to use, so this sits far below both the documented default and
# the observed real one instead of trying to track wherever wg-quick lands.
wg_killswitch_rule_priority: 100

# Let DNS out of the public interface even when the tunnel is down.
#
# Worth understanding before turning it off: a wg_peer_endpoint that is a DNS
# name has to be resolved before the tunnel can come up, and with the tunnel
# down the only resolver the host can reach is out there. Blocking it means the
# tunnel can never recover on its own. An endpoint written as a bare IP address
# does not have this problem, and is the only case where turning this off is
# safe.
wg_killswitch_allow_dns: true

# Extra iptables match specifications allowed out of the public interface, each
# appended to the kill switch's OUTPUT chain ahead of its final DROP. Written
# as raw iptables arguments, e.g.
#
#   wg_killswitch_extra_allow:
#     - "-p tcp --dport 443 -d 203.0.113.10"
#
# Scope every entry. An unscoped one is a hole in the only thing keeping this
# host's traffic inside the tunnel.
wg_killswitch_extra_allow: []

# How long the automatic rollback waits before undoing the tunnel and the kill
# switch, if the play does not get far enough to cancel it. It is armed before
# the default route moves and cancelled once the host has been confirmed
# reachable, so it only ever fires on a run that locked itself out.
wg_rollback_delay: 5min
