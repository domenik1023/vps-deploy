# Handlers fire in the order they are defined here, not the order they are
# notified, so the daemon-reload has to come before any service it affects.
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart Docker
  ansible.builtin.service:
    name: docker
    state: restarted

# `ufw reload` is a stop/start: it flushes the built-in chains and deletes every
# non-builtin one, which takes the CrowdSec bouncer's rules with it. So it has
# to be defined ahead of the bouncer handler that puts them back, and it has to
# notify that handler itself - a run that only touches before.rules would
# otherwise leave the host unprotected until the next bouncer restart.
- name: Reload UFW
  community.general.ufw:
    state: reloaded
  notify: Restart CrowdSec bouncer

- name: Restart CrowdSec
  ansible.builtin.service:
    name: crowdsec
    state: restarted

# CrowdSec is installed on internet-facing hosts only, so on a [local] host
# there is no unit here to restart and `service:` fails on the missing one.
# That path is reachable rather than theoretical: `Reload UFW` notifies this
# handler, and ufw_allow_rules is host-settable - the moment a local host sets
# one, the run ends by trying to restart a bouncer that was never installed.
- name: Restart CrowdSec bouncer
  when: "'local' not in group_names"
  ansible.builtin.service:
    name: "{{ crowdsec_firewall_bouncer_service }}"
    state: restarted
