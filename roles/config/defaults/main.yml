# --- User ---
admin_user: domenik1023
# admin_password must be defined in group_vars/all/vault.yml (ansible-vault encrypted)
# Set it as: vault_admin_password: "<sha512-crypt hash>"
admin_password: "{{ vault_admin_password }}"

# --- SSH ---
ssh_port: 22822
# ssh_old_port is the standard port opened during initial bootstrap.
# It is explicitly denied by hardening tasks once the custom port is confirmed.
ssh_old_port: 22

# --- UFW ---
# For reading by hand only. CrowdSec does not consume these lines and must not
# be made to depend on them: at every level below `high`, ufw attaches
# `-m limit --limit 3/min --limit-burst 10` to its own LOG rules, which starves
# the port-scan scenario outright (see crowdsec_firewall_log_prefix below).
# Raising this does not fix that either - explicit `deny` rules log on a
# separate path with a limit hardcoded in ufw's source. The rule CrowdSec
# actually reads is installed by crowdsec.yml and carries no limit.
ufw_logging: low

# --- Fail2ban ---
# Deliberately duller than CrowdSec, which should ban first: its decisions go to
# the central LAPI and apply across the whole fleet, while a fail2ban ban only
# covers the host that saw the traffic. crowdsecurity/ssh-bf overflows at 6
# failures arriving faster than one per 10s, and ssh-slow-bf at 11 faster than
# one per 60s, so a threshold above both leaves fail2ban as an independent
# backstop for the case CrowdSec cannot cover for itself - the agent, the LAPI
# or the bouncer being down.
#
# Exact ordering cannot hold at every attack rate: CrowdSec leaks its buckets
# while fail2ban counts in a fixed window, so the two cross over somewhere in
# the middle. This is tuned for the common case, a fast brute force.
fail2ban_maxretry: 15
fail2ban_findtime: 10m
fail2ban_bantime: 1h

# --- Unattended upgrades ---
# Security updates install daily, but anything touching the kernel or libc only
# takes effect after a reboot. unattended-upgrades can only express a time of
# day for that reboot, never a weekday, so it is driven by a systemd timer.
unattended_reboot_enabled: true
unattended_reboot_oncalendar: "Sat *-*-* 05:00:00"

# --- Docker ---
# Convention for where persistent volume data is bind-mounted from; the
# playbook only creates the directory. Docker's own data root is left at
# /var/lib/docker.
docker_data_dir: /mnt/docker

# Written to /etc/docker/daemon.json.
docker_daemon_options:
  live-restore: true
  log-driver: json-file
  log-opts:
    max-size: 10m
    max-file: "3"
  no-new-privileges: true

# User namespace remapping maps container root to an unprivileged host UID,
# which is good isolation but breaks any container that bind-mounts
# /var/run/docker.sock - the socket is root:docker, and remapped root is
# neither. Container managers run that way (Komodo Periphery, Portainer,
# Watchtower, a Traefik docker provider), so it is off by default.
#
# It also moves the data root to /var/lib/docker/<subuid>.<subgid>/, so
# toggling it hides every container, image and volume created under the other
# setting. Set to "default" only on hosts that run no such container, and
# expect to migrate their data.
docker_userns_remap: ""

# --- CrowdSec ---
# Installed on internet-facing hosts only; the [local] group is skipped in
# tasks/main.yml, same as the SSH hardening tasks.
# Collections every agent gets (parsers + scenarios).
#   linux    - sshd and syslog
#   iptables - port-scan detection, the only source here that covers ports
#              nothing listens on. crowdsecurity/iptables-scan-multi_ports is a
#              leaky bucket of capacity 15 that drains one entry every 5s, so it
#              overflows only when 16 *distinct* destination ports from one IP
#              arrive faster than 12/min. Single-port probing is ignored, and so
#              is any slow sweep - it takes a burst.
# Add host-specific ones to crowdsec_collections_extra rather than editing this
# list, which is why they are two variables: a host_vars override replaces a
# list outright, and silently dropping crowdsecurity/linux disables sshd
# detection with nothing to show for it.
crowdsec_collections:
  - crowdsecurity/linux
  - crowdsecurity/iptables

# Per-host additions, e.g. crowdsecurity/caddy on a host serving HTTP.
crowdsec_collections_extra: []

# Extra log sources for this host, each written to
# /etc/crowdsec/acquis.d/<key>.yaml. sshd is always read from journald; a host
# running web services needs its own entry here, since CrowdSec parses nothing
# it has not been pointed at. See docs/crowdsec.md for worked examples.
crowdsec_acquisitions: {}

# Prefix on the LOG rule that feeds crowdsecurity/iptables-logs.
#
# CrowdSec does not read ufw's `[UFW BLOCK]` lines, for two independent
# reasons: ufw rate-limits its own LOG rules to 3/min below loglevel `high`,
# and an explicit `deny` rule - port 22 here - terminates in ufw-user-input
# without logging at all unless it was added with `log`, which then carries its
# own hardcoded 3/min limit. Upstream states the requirement plainly in
# crowdsecurity/iptables-logs' documentation:
#
#   "you should have a `iptables -A INPUT -m state --state NEW -j LOG` or
#    similar into your configuration. This one will log all new connections,
#    successful or not."
#
# crowdsec.yml installs exactly that in ufw's before.rules, ahead of every user
# rule, so nothing is throttled and nothing is dropped before it is seen.
#
# The prefix only has to clear the parser's two exclusions - it must not
# contain "ACCEPT" and must not be "[UFW AUDIT]". Do not reuse "[UFW BLOCK]":
# these are all new connections, accepted ones included, and the parser counts
# every parsed TCP/UDP packet as a drop regardless of what the prefix claims.
# tests/render-check.yml asserts the shape; iptables caps prefixes at 29 chars.
crowdsec_firewall_log_prefix: "[CS NEW] "

# Public source addresses that must never earn a decision. Worth setting: the
# rule above logs accepted connections too and the parser treats them as drops,
# while any decision this agent raises is stored on the central LAPI and
# enforced on every host in the fleet - so a single false positive locks you out
# everywhere at once. crowdsecurity/whitelists, which crowdsecurity/linux pulls
# in, already covers RFC1918; these are for public addresses such as your admin
# IP or an external monitoring probe. No file is written while both are empty.
crowdsec_whitelist_ips: []
crowdsec_whitelist_cidrs: []

# UFW on Ubuntu drives netfilter via iptables-nft, so the iptables bouncer
# variant is the right fit. Switch to crowdsec-firewall-bouncer-nftables for
# pure-nftables setups.
crowdsec_firewall_bouncer_package: crowdsec-firewall-bouncer-iptables
# Both packages ship the same systemd unit, so the service name does not follow
# the package name.
crowdsec_firewall_bouncer_service: crowdsec-firewall-bouncer

# Which backend the bouncer drives. Upstream ships the config as a template
# with `mode: ${BACKEND}`, substituted per package at build time; a base config
# that is the raw template instead leaves the placeholder in place and the
# bouncer refuses to start with "firewall '${BACKEND}' is not supported".
# Pinning the mode in the .local overlay makes startup independent of whatever
# the base file happens to contain.
crowdsec_firewall_bouncer_mode: "{{ 'nftables' if 'nftables' in crowdsec_firewall_bouncer_package else 'iptables' }}"

# Central LAPI server this agent reports to.
crowdsec_lapi_url: "https://crowdsec.d1023.de"
crowdsec_lapi_login: "{{ inventory_hostname }}"
crowdsec_bouncer_name: "{{ inventory_hostname }}-firewall-bouncer"

# Chains the firewall bouncer drops banned traffic in. Anything listed here is
# applied to iptables *and* ip6tables, so it must exist in both families.
crowdsec_bouncer_iptables_chains:
  - INPUT

# IPv4-only chains. The bouncer aborts at startup if a configured chain is
# missing, and Docker only creates DOCKER-USER in ip6tables when IPv6 is
# enabled for Docker, so it cannot go in the list above.
#
# DOCKER-USER itself is the hook Docker provides for filtering traffic it
# forwards, traversed before its own accept rules. Without it the upstream
# default of INPUT alone covers services on the host but not published
# container ports. Container-to-container traffic crosses the chain too, but
# only ever with RFC1918 source addresses, which never appear in a ban list.
#
# Chains that do not exist on a host are dropped at run time rather than
# breaking the bouncer.
crowdsec_bouncer_iptables_v4_chains:
  - DOCKER-USER

# Inventory host running the central LAPI. Required: machine credentials and
# the bouncer API key are created there by running cscli over delegation, so
# no CrowdSec secret is ever stored in the vault. Existing working credentials
# are reused; they are only rotated when missing, stale or rejected.
# Inventory name, not an address: delegation resolves it through the inventory
# so the host's own connection settings in host_vars apply.
crowdsec_lapi_host: "crowdsec-master"
# Set when the LAPI runs in a Docker container on that host: cscli is then
# invoked inside the container instead of on the host itself.
crowdsec_lapi_docker_container: "crowdsec-master-crowdsec-1"
# How to invoke cscli on the LAPI host. Override directly for setups the two
# variables above do not cover (podman, docker compose, a wrapper script).
crowdsec_lapi_cscli: "{{ ['docker', 'exec', crowdsec_lapi_docker_container, 'cscli'] if crowdsec_lapi_docker_container | length > 0 else ['cscli'] }}"
# Set to false if the LAPI serves a self-signed certificate.
crowdsec_lapi_validate_certs: true
