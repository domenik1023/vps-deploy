# --- SYSTEM PREPARATION & UPDATES ---

- name: Install essential software and maintenance tools
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - git
      - jq
      - net-tools
      - nano
      - unattended-upgrades  # Enables automated security updates
      - apt-listchanges      # Logs changes for automated updates
      - chrony               # NTP time synchronisation
    state: present
    update_cache: true

# 20auto-upgrades is the standard file to toggle the periodic update timer
- name: Configure auto-updates (daily)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    owner: root
    group: root
    mode: "0644"

# --- NTP ---

- name: Ensure chrony is enabled and running
  ansible.builtin.service:
    name: chronyd
    enabled: true
    state: started

# --- DOCKER CLEANUP & INSTALLATION ---

# Removes old or distro-packaged versions of Docker to avoid binary conflicts
- name: Remove conflicting container packages
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-doc
      - docker-compose
      - docker-compose-v2
      - podman-docker
      - containerd
      - runc
    state: absent
    purge: true

# Authenticates the Docker repository to prevent MITM attacks
- name: Add Docker GPG key
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

# Adds the official Docker repo for the specific Ubuntu release version
- name: Add Docker APT repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Install official Docker engine packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

# --- DOCKER SECURITY CONFIGURATION ---

# Enables live-restore (containers keep running on daemon restart),
# enforces log rotation, and enables user namespace remapping for isolation.
- name: Configure Docker daemon security options
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    content: |
      {
        "live-restore": true,
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        },
        "userns-remap": "default",
        "no-new-privileges": true
      }
  register: docker_daemon_conf
  notify: Restart Docker

# --- POST-INSTALLATION CONFIGURATION ---

- name: Ensure Docker service is enabled and started
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

# Allows the admin user to run docker commands without sudo
- name: Add admin user to docker group
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: docker
    append: true

# Standardised mount point for Docker volumes / persistent data
- name: Create persistent Docker data directory
  ansible.builtin.file:
    path: "{{ docker_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
