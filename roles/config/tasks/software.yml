# --- SYSTEM PREPARATION & UPDATES ---

- name: Install essential software and maintenance tools
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - git
      - jq
      - net-tools
      - nano
      - unattended-upgrades  # Enables automated security updates
      - apt-listchanges      # Logs changes for automated updates
      - chrony               # NTP time synchronisation
    state: present
    update_cache: true

# 20auto-upgrades is the standard file to toggle the periodic update timer
- name: Configure auto-updates (daily)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    owner: root
    group: root
    mode: "0644"

# --- NTP ---

- name: Ensure chrony is enabled and running
  ansible.builtin.service:
    name: chronyd
    enabled: true
    state: started

# --- DOCKER CLEANUP & INSTALLATION ---

# Removes old or distro-packaged versions of Docker to avoid binary conflicts
- name: Remove conflicting container packages
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-doc
      - docker-compose
      - docker-compose-v2
      - podman-docker
      - containerd
      - runc
    state: absent
    purge: true

# apt-key is removed on Ubuntu 24.04+; use the signed-by keyring pattern instead.
- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
    force: false

# apt_repository wrote docker.list; deb822_repository writes docker.sources.
# Both being present would make apt read the repository twice.
- name: Remove the legacy Docker APT source list
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Add Docker APT repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: ["https://download.docker.com/linux/ubuntu"]
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [stable]
    architectures: ["{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' }}"]
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Install official Docker engine packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

# --- DOCKER SECURITY CONFIGURATION ---

# Enables live-restore (containers keep running on daemon restart), enforces
# log rotation and blocks privilege escalation inside containers. User
# namespace remapping is opt-in via docker_userns_remap - see the comment on
# that variable for why it is not on by default.
- name: Configure Docker daemon security options
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    content: "{{ (docker_daemon_options | combine({'userns-remap': docker_userns_remap}) if docker_userns_remap | length > 0 else docker_daemon_options) | to_nice_json }}\n"
  register: docker_daemon_conf
  notify: Restart Docker

# --- POST-INSTALLATION CONFIGURATION ---

- name: Ensure Docker service is enabled and started
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

# Allows the admin user to run docker commands without sudo
- name: Add admin user to docker group
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: docker
    append: true

# Standardised mount point for Docker volumes / persistent data
- name: Create persistent Docker data directory
  ansible.builtin.file:
    path: "{{ docker_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
