# --- CROWDSEC INSTALLATION (agent-only, central LAPI) ---
# This host runs CrowdSec as a log processor only. Alerts are pushed to the
# central LAPI server ({{ crowdsec_lapi_url }}) and the firewall bouncer pulls
# its ban decisions from there, so bans propagate across all machines.
#
# Credentials for that LAPI are minted on the LAPI server itself, by running
# cscli there over delegation; see crowdsec_credentials.yml.
#
# Uses the official CrowdSec packagecloud repository (distro packages are
# outdated) with the signed-by keyring pattern, same as the Docker repo.

- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download CrowdSec GPG key
  ansible.builtin.get_url:
    url: https://packagecloud.io/crowdsec/crowdsec/gpgkey
    dest: /etc/apt/keyrings/crowdsec.asc
    owner: root
    group: root
    mode: "0644"
    force: false

# apt_repository wrote crowdsec.list; deb822_repository writes crowdsec.sources.
# Both being present would make apt read the repository twice.
- name: Remove the legacy CrowdSec APT source list
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/crowdsec.list
    state: absent

- name: Add CrowdSec APT repository
  ansible.builtin.deb822_repository:
    name: crowdsec
    types: [deb]
    uris: ["https://packagecloud.io/crowdsec/crowdsec/ubuntu"]
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [main]
    signed_by: /etc/apt/keyrings/crowdsec.asc
    state: present

- name: Install CrowdSec agent
  ansible.builtin.apt:
    name: crowdsec
    state: present
    update_cache: true

- name: Install CrowdSec firewall bouncer
  ansible.builtin.apt:
    name: "{{ crowdsec_firewall_bouncer_package }}"
    state: present

# --- CENTRAL LAPI WIRING ---
# config.yaml.local overlays config.yaml, so package upgrades never revert
# this. Disabling the API server turns the local daemon into a pure agent;
# CAPI signal push is handled by the central LAPI server.
- name: Disable local API server (agent-only mode)
  ansible.builtin.copy:
    dest: /etc/crowdsec/config.yaml.local
    owner: root
    group: root
    mode: "0644"
    content: |
      api:
        server:
          enable: false
  notify: Restart CrowdSec

# --- CREDENTIALS ---
- name: Require a central LAPI server to provision credentials against
  ansible.builtin.assert:
    that:
      - crowdsec_lapi_host | length > 0
    fail_msg: >-
      Set crowdsec_lapi_host to the inventory host running the central CrowdSec
      LAPI. This agent's machine credentials and bouncer API key are created
      there automatically.

- name: Provision LAPI credentials on the central LAPI server
  ansible.builtin.include_tasks:
    file: crowdsec_credentials.yml

- name: Point agent at the central LAPI server
  ansible.builtin.copy:
    dest: /etc/crowdsec/local_api_credentials.yaml
    owner: root
    group: root
    mode: "0600"
    content: |
      url: {{ crowdsec_lapi_url }}
      login: {{ crowdsec_lapi_login }}
      password: {{ crowdsec_lapi_password_resolved }}
  no_log: true
  notify: Restart CrowdSec

# A chain the bouncer cannot find aborts its startup, and `-t` runs the same
# initialisation, so the config test fails too and systemd never starts the
# unit. Probe first and configure only what is actually there.
- name: Check which IPv4-only bouncer chains exist on this host
  ansible.builtin.command:
    argv: [iptables, --numeric, --list, "{{ item }}"]
  loop: "{{ crowdsec_bouncer_iptables_v4_chains }}"
  register: crowdsec_v4_chain_probe
  changed_when: false
  failed_when: false
  check_mode: false

- name: Keep only the IPv4 chains that exist
  ansible.builtin.set_fact:
    crowdsec_bouncer_v4_chains_present: "{{ crowdsec_v4_chain_probe.results | selectattr('rc', 'eq', 0) | map(attribute='item') | list }}"

- name: Report IPv4 chains skipped because this host does not have them
  ansible.builtin.debug:
    msg: >-
      Not enforcing CrowdSec bans in
      {{ crowdsec_bouncer_iptables_v4_chains | difference(crowdsec_bouncer_v4_chains_present) | join(', ') }}
      - absent on this host. Traffic through those chains stays unfiltered.
  when: crowdsec_bouncer_v4_chains_present | length < crowdsec_bouncer_iptables_v4_chains | length

# The bouncer package auto-registers against a local LAPI, which doesn't
# exist here. The .local overlay redirects it to the central LAPI with a
# key created there via `cscli bouncers add`.
- name: Point firewall bouncer at the central LAPI server
  ansible.builtin.copy:
    dest: /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml.local
    owner: root
    group: root
    mode: "0600"
    content: "{{ {'mode': crowdsec_firewall_bouncer_mode, 'api_url': crowdsec_lapi_url, 'api_key': crowdsec_bouncer_api_key_resolved, 'iptables_chains': crowdsec_bouncer_iptables_chains, 'iptables_v4_chains': crowdsec_bouncer_v4_chains_present} | to_nice_yaml }}"
  no_log: true
  notify: Restart CrowdSec bouncer

# DOCKER-USER only exists once dockerd has built its iptables rules. The
# bouncer's own unit orders itself after crowdsec.service but knows nothing
# about Docker, so on boot it can lose that race and fail to insert its rules.
- name: Ensure the firewall bouncer unit drop-in directory exists
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ crowdsec_firewall_bouncer_service }}.service.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: "'DOCKER-USER' in crowdsec_bouncer_v4_chains_present"

- name: Order the firewall bouncer after Docker
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ crowdsec_firewall_bouncer_service }}.service.d/10-after-docker.conf"
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      After=docker.service
      Wants=docker.service
  when: "'DOCKER-USER' in crowdsec_bouncer_v4_chains_present"
  notify:
    - Reload systemd
    - Restart CrowdSec bouncer

# --- ACQUISITION ---
# Minimal Ubuntu images may not ship rsyslog, so /var/log/auth.log can be
# missing. Read sshd authentication events straight from the journal to be
# independent of rsyslog.
- name: Configure journald acquisition for sshd
  ansible.builtin.copy:
    dest: /etc/crowdsec/acquis.d/sshd-journald.yaml
    owner: root
    group: root
    mode: "0644"
    content: |
      source: journalctl
      journalctl_filter:
        - "_SYSTEMD_UNIT=ssh.service"
      labels:
        type: syslog
  notify: Restart CrowdSec

# Per-host sources - a Caddy container, an nginx log file, another unit.
# Removing an entry leaves its file behind; delete it on the host by hand.
- name: Configure extra acquisition sources
  ansible.builtin.copy:
    dest: "/etc/crowdsec/acquis.d/{{ item.key }}.yaml"
    owner: root
    group: root
    mode: "0644"
    content: "{{ item.value | to_nice_yaml }}"
  loop: "{{ crowdsec_acquisitions | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  notify: Restart CrowdSec

# --- COLLECTIONS ---
# Parsers/scenarios run on the agent, so collections are installed locally
# even in central-LAPI mode. crowdsecurity/linux bundles sshd + syslog.
# An installed collection materialises as /etc/crowdsec/collections/<name>.yaml,
# which serves as the idempotency guard here.
- name: Install CrowdSec collections
  ansible.builtin.command: "cscli collections install {{ item }}"
  args:
    creates: "/etc/crowdsec/collections/{{ item | basename }}.yaml"
  loop: "{{ crowdsec_collections }}"
  notify: Restart CrowdSec

# --- SERVICES ---
- name: Ensure CrowdSec service is enabled and running
  ansible.builtin.service:
    name: crowdsec
    enabled: true
    state: started

- name: Ensure CrowdSec firewall bouncer is enabled and running
  ansible.builtin.service:
    name: "{{ crowdsec_firewall_bouncer_service }}"
    enabled: true
    state: started
