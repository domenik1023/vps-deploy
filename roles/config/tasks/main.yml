- name: Include user tasks
  ansible.builtin.include_tasks:
    file: user.yml

- name: Include hardening tasks
  ansible.builtin.include_tasks:
    file: hardening.yml

- name: Include sysctl kernel hardening tasks
  ansible.builtin.include_tasks:
    file: sysctl.yml

- name: Include software tasks
  ansible.builtin.include_tasks:
    file: software.yml

# Skipped for local test hosts: they sit behind NAT, see none of the internet
# noise CrowdSec exists to catch, and each one would still consume a machine
# registration and a bouncer key on the central LAPI.
- name: Include CrowdSec tasks
  ansible.builtin.include_tasks:
    file: crowdsec.yml
  when: "'local' not in group_names"
