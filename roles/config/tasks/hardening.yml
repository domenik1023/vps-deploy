# --- Packages / updates ---
- name: Update all packages
  ansible.builtin.apt:
    upgrade: dist
    update_cache: true

- name: Ensure base packages are installed
  ansible.builtin.apt:
    name:
      - openssh-server
      - ufw
      - fail2ban
      # deb822_repository parses and writes .sources files through python-debian;
      # it is not part of a stock Ubuntu image, and the Docker and CrowdSec
      # repository tasks later in the play both need it.
      - python3-debian
    state: present

# --- UFW ---
# Open the port the active Ansible SSH session is using BEFORE enabling UFW.
# Without this, `ufw enable` activates default-deny incoming and instantly
# drops the live session, leaving the host unreachable mid-play.
#
# Use `allow` (not `limit`) — UFW's limit rule rejects with
# icmp-port-unreachable once >6 new connections hit in 30s, which Ansible
# trips easily by reconnecting per task. The new ssh_port still gets
# `limit` below for production protection.
- name: Allow current SSH port in UFW (bootstrap, prevents lockout)
  community.general.ufw:
    rule: allow
    port: "{{ ansible_port | default(22) }}"
    proto: tcp

# Rate-limit the custom SSH port (blocks IPs exceeding 6 connections/30s at the kernel level)
- name: Rate-limit custom SSH port in UFW
  community.general.ufw:
    rule: limit
    port: "{{ ssh_port }}"
    proto: tcp

- name: Enable UFW
  community.general.ufw:
    state: enabled

# --- Fail2ban jail for sshd on custom port ---
- name: Configure fail2ban jail for sshd
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd-local.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [sshd]
      enabled   = true
      port      = {{ ssh_port }}
      banaction = ufw
      maxretry  = {{ fail2ban_maxretry }}
      findtime  = {{ fail2ban_findtime }}
      bantime   = {{ fail2ban_bantime }}
  register: f2b_jail

# --- SSH hardening (skipped for local test hosts to prevent lockout) ---
- name: SSH hardening block
  when: "'local' not in group_names"
  block:
    - name: Ensure sshd_config.d exists
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d
        state: directory
        mode: "0755"

    - name: Set SSH port via drop-in
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-port.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          Port {{ ssh_port }}
      register: ssh_port_conf

    - name: Hardening options via drop-in
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/20-hardening.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          PermitRootLogin no
          PasswordAuthentication no
          PubkeyAuthentication yes
          X11Forwarding no
          AllowUsers {{ admin_user }}
          MaxAuthTries 3
          LoginGraceTime 30
          ClientAliveInterval 300
          ClientAliveCountMax 2
      register: ssh_hardening_conf

    # Kill socket activation so sshd binds the port itself
    - name: Disable and mask ssh.socket
      ansible.builtin.systemd:
        name: ssh.socket
        state: stopped
        enabled: false
        masked: true
        daemon_reload: true
      failed_when: false  # ok if the unit doesn't exist

    - name: Validate sshd config
      ansible.builtin.command: sshd -t
      changed_when: false

    - name: Ensure ssh service is enabled and running
      ansible.builtin.systemd:
        name: ssh
        enabled: true
        state: started
        daemon_reload: true

    - name: Restart ssh if config changed
      ansible.builtin.systemd:
        name: ssh
        state: restarted
      when: ssh_port_conf.changed or ssh_hardening_conf.changed
      register: ssh_restarted

    # After sshd moves to the new port, subsequent tasks must reconnect there.
    - name: Switch ansible_port to the new SSH port for the rest of the play
      ansible.builtin.set_fact:
        ansible_port: "{{ ssh_port }}"
      when: ssh_restarted is changed

    - name: Wait for sshd on the new port
      ansible.builtin.wait_for_connection:
        delay: 2
        timeout: 30
      when: ssh_restarted is changed

# --- Fail2ban restart if jail changed ---
- name: Restart fail2ban if jail changed
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
  when: f2b_jail.changed

# Lock down the old SSH port now that sshd has moved to {{ ssh_port }}.
# Skipped for local hosts because the hardening block above didn't move sshd,
# so denying port 22 would lock us out.
- name: Tighten UFW on old SSH port
  when:
    - "'local' not in group_names"
    - ssh_old_port != ssh_port
  block:
    # Remove the bootstrap allow before adding the deny — UFW evaluates
    # rules in order and "first match wins", so a leftover allow would
    # shadow the deny.
    - name: Remove bootstrap allow rule for old SSH port
      community.general.ufw:
        rule: allow
        port: "{{ ssh_old_port }}"
        proto: tcp
        delete: true

    - name: Deny standard SSH port (port 22)
      community.general.ufw:
        rule: deny
        port: "{{ ssh_old_port }}"
        proto: tcp

# --- Root lockdown (keep last; ensure admin user has sudo before this runs) ---
- name: Lock the root account (no password, no login)
  ansible.builtin.user:
    name: root
    password: "!"
    shell: /usr/sbin/nologin
