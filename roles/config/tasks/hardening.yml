# --- Packages / updates ---
- name: Update all packages
  ansible.builtin.apt:
    upgrade: dist
    update_cache: true

- name: Ensure base packages are installed
  ansible.builtin.apt:
    name:
      - openssh-server
      - ufw
      - fail2ban
    state: present

# --- UFW ---
# Rate-limit the custom SSH port (blocks IPs exceeding 6 connections/30s at the kernel level)
- name: Rate-limit custom SSH port in UFW
  community.general.ufw:
    rule: limit
    port: "{{ ssh_port }}"
    proto: tcp

- name: Enable UFW
  community.general.ufw:
    state: enabled

# Close the standard SSH port once the firewall is active.
# This runs on every play and is idempotent (deleting a non-existent rule is a no-op).
- name: Deny standard SSH port (port 22)
  community.general.ufw:
    rule: deny
    port: "{{ ssh_old_port }}"
    proto: tcp

# --- Fail2ban jail for sshd on custom port ---
- name: Configure fail2ban jail for sshd
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd-local.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [sshd]
      enabled   = true
      port      = {{ ssh_port }}
      banaction = ufw
      maxretry  = {{ fail2ban_maxretry }}
      findtime  = {{ fail2ban_findtime }}
      bantime   = {{ fail2ban_bantime }}
  register: f2b_jail

# --- SSH hardening (skipped for local test hosts to prevent lockout) ---
- name: SSH hardening block
  when: "'local' not in group_names"
  block:
    - name: Ensure sshd_config.d exists
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d
        state: directory
        mode: "0755"

    - name: Set SSH port via drop-in
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-port.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          Port {{ ssh_port }}
      register: ssh_port_conf

    - name: Hardening options via drop-in
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/20-hardening.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          PermitRootLogin no
          PasswordAuthentication no
          PubkeyAuthentication yes
          X11Forwarding no
          AllowUsers {{ admin_user }}
          MaxAuthTries 3
          LoginGraceTime 30
          ClientAliveInterval 300
          ClientAliveCountMax 2
      register: ssh_hardening_conf

    # Kill socket activation so sshd binds the port itself
    - name: Disable and mask ssh.socket
      ansible.builtin.systemd:
        name: ssh.socket
        state: stopped
        enabled: false
        masked: true
        daemon_reload: true
      failed_when: false  # ok if the unit doesn't exist

    - name: Validate sshd config
      ansible.builtin.command: sshd -t
      changed_when: false

    - name: Ensure ssh service is enabled and running
      ansible.builtin.systemd:
        name: ssh
        enabled: true
        state: started
        daemon_reload: true

    - name: Restart ssh if config changed
      ansible.builtin.systemd:
        name: ssh
        state: restarted
      when: ssh_port_conf.changed or ssh_hardening_conf.changed

# --- Fail2ban restart if jail changed ---
- name: Restart fail2ban if jail changed
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
  when: f2b_jail.changed

# --- Root lockdown (keep last; ensure admin user has sudo before this runs) ---
- name: Lock the root account (no password, no login)
  ansible.builtin.user:
    name: root
    password: "!"
    shell: /usr/sbin/nologin
