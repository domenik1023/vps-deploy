# --- AUTOMATIC LAPI CREDENTIAL PROVISIONING ---
# Runs `cscli` on the central LAPI server ({{ crowdsec_lapi_host }}) via
# delegation, so machine credentials and the bouncer API key never have to be
# created by hand or pasted into the vault. `crowdsec_lapi_cscli` carries the
# invocation prefix, so a LAPI running in a container is reached with
# `docker exec <container> cscli ...` instead.
#
# cscli is the only way to do this: the LAPI's HTTP API can register a machine
# (POST /v1/watchers) but only when auto-registration is enabled on the server,
# and it exposes no endpoint at all for creating a bouncer.
#
# Both halves follow the same shape:
#   1. read what the agent already has on disk
#   2. verify it still works against the LAPI
#   3. only if it does not, mint a new secret and register it on the LAPI
#
# That keeps re-runs idempotent: working credentials are reused verbatim, and
# secrets are rotated only when they are missing, stale or rejected.

# --- AGENT (MACHINE) CREDENTIALS ---
- name: Check for existing agent credentials
  ansible.builtin.stat:
    path: /etc/crowdsec/local_api_credentials.yaml
  register: crowdsec_agent_creds_file

- name: Read existing agent credentials
  ansible.builtin.slurp:
    src: /etc/crowdsec/local_api_credentials.yaml
  register: crowdsec_agent_creds_raw
  when: crowdsec_agent_creds_file.stat.exists
  no_log: true

- name: Parse existing agent credentials
  ansible.builtin.set_fact:
    crowdsec_agent_creds: >-
      {{ (crowdsec_agent_creds_raw.content | b64decode | from_yaml | default({}, true))
         if crowdsec_agent_creds_file.stat.exists else {} }}
  no_log: true

# `cscli lapi status` authenticates against the LAPI named in the credentials
# file, so it validates URL, login and password in one shot. It is only
# meaningful when that file already points where we want it to.
- name: Verify the existing agent credentials against the LAPI
  ansible.builtin.command:
    argv:
      - cscli
      - lapi
      - status
  register: crowdsec_lapi_status
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - crowdsec_agent_creds.url | default('') == crowdsec_lapi_url
    - crowdsec_agent_creds.login | default('') == crowdsec_lapi_login
    - crowdsec_agent_creds.password | default('') | length > 0

- name: Decide whether the agent needs to be registered
  ansible.builtin.set_fact:
    crowdsec_agent_needs_registration: "{{ crowdsec_lapi_status.rc | default(1) != 0 }}"

- name: Resolve the agent LAPI password
  ansible.builtin.set_fact:
    crowdsec_lapi_password_resolved: >-
      {{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits'])
         if crowdsec_agent_needs_registration
         else crowdsec_agent_creds.password }}
  no_log: true

# --force replaces an existing machine of the same name, which covers the case
# where the LAPI still knows this host but the agent lost its credentials.
# throttle keeps concurrent plays from writing the LAPI database at once.
- name: Register the agent on the central LAPI server
  ansible.builtin.command:
    argv: "{{ crowdsec_lapi_cscli + ['machines', 'add', crowdsec_lapi_login, '--password', crowdsec_lapi_password_resolved, '--force'] }}"
  delegate_to: "{{ crowdsec_lapi_host }}"
  throttle: 1
  changed_when: true
  no_log: true
  when: crowdsec_agent_needs_registration

# --- BOUNCER API KEY ---
- name: Check for an existing bouncer configuration
  ansible.builtin.stat:
    path: /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml.local
  register: crowdsec_bouncer_conf_file

- name: Read the existing bouncer configuration
  ansible.builtin.slurp:
    src: /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml.local
  register: crowdsec_bouncer_conf_raw
  when: crowdsec_bouncer_conf_file.stat.exists
  no_log: true

- name: Parse the existing bouncer configuration
  ansible.builtin.set_fact:
    crowdsec_bouncer_conf: >-
      {{ (crowdsec_bouncer_conf_raw.content | b64decode | from_yaml | default({}, true))
         if crowdsec_bouncer_conf_file.stat.exists else {} }}
  no_log: true

# There is no cscli command to test a bouncer key, and the LAPI only stores its
# hash, so ask the LAPI directly: 200 means the key is accepted, 403 means it
# was revoked or never existed.
- name: Verify the existing bouncer API key against the LAPI
  ansible.builtin.uri:
    url: "{{ crowdsec_lapi_url }}/v1/decisions"
    method: GET
    headers:
      X-Api-Key: "{{ crowdsec_bouncer_conf.api_key }}"
    validate_certs: "{{ crowdsec_lapi_validate_certs }}"
    status_code: [200, 403]
  register: crowdsec_bouncer_key_check
  changed_when: false
  # 403 is an expected answer (rotate the key), anything else - including a
  # module or connection error - is a real problem and should stop the play
  # rather than silently trigger a rotation.
  failed_when: crowdsec_bouncer_key_check.status | default(0) not in [200, 403]
  check_mode: false
  no_log: true
  when:
    - crowdsec_bouncer_conf.api_url | default('') == crowdsec_lapi_url
    - crowdsec_bouncer_conf.api_key | default('') | length > 0

- name: Decide whether the bouncer needs to be registered
  ansible.builtin.set_fact:
    crowdsec_bouncer_needs_registration: "{{ crowdsec_bouncer_key_check.status | default(0) != 200 }}"

- name: Resolve the bouncer API key
  ansible.builtin.set_fact:
    crowdsec_bouncer_api_key_resolved: >-
      {{ lookup('ansible.builtin.password', '/dev/null', length=48, chars=['ascii_letters', 'digits'])
         if crowdsec_bouncer_needs_registration
         else crowdsec_bouncer_conf.api_key }}
  no_log: true

# `cscli bouncers add` has no --force, so a stale registration of the same name
# has to go first.
- name: List bouncers registered on the central LAPI server
  ansible.builtin.command:
    argv: "{{ crowdsec_lapi_cscli + ['bouncers', 'list', '-o', 'json'] }}"
  delegate_to: "{{ crowdsec_lapi_host }}"
  register: crowdsec_lapi_bouncers
  changed_when: false
  check_mode: false
  when: crowdsec_bouncer_needs_registration

- name: Remove the stale bouncer registration
  ansible.builtin.command:
    argv: "{{ crowdsec_lapi_cscli + ['bouncers', 'delete', crowdsec_bouncer_name] }}"
  delegate_to: "{{ crowdsec_lapi_host }}"
  throttle: 1
  changed_when: true
  when:
    - crowdsec_bouncer_needs_registration
    # An empty bouncer list prints `[]` or `null` depending on the cscli
    # version, hence the two defaults.
    - crowdsec_bouncer_name in ((crowdsec_lapi_bouncers.stdout | default('[]', true)
                                 | from_json | default([], true))
                                | map(attribute='name') | list)

- name: Register the firewall bouncer on the central LAPI server
  ansible.builtin.command:
    argv: "{{ crowdsec_lapi_cscli + ['bouncers', 'add', crowdsec_bouncer_name, '--key', crowdsec_bouncer_api_key_resolved] }}"
  delegate_to: "{{ crowdsec_lapi_host }}"
  throttle: 1
  changed_when: true
  no_log: true
  when: crowdsec_bouncer_needs_registration
