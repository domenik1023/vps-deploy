# These fire in the play's handler definition order, not in notification order,
# and that order is set by the role order in main.yml: roles/baseline defines
# `Reload systemd`, `Restart Docker` and `Reload UFW` before anything here.
# That is what `Reload UFW` depends on - it notifies `Restart CrowdSec bouncer`
# below to put the bouncer's chains back after its iptables-restore flushes
# them, and a handler cannot notify one that fires before it.
- name: Restart CrowdSec
  ansible.builtin.service:
    name: crowdsec
    state: restarted

# Notified by `Reload UFW` in roles/baseline, which fires on *any* host that
# changes a ufw rule - and that includes LAN boxes, because
# docker_host_access_cidrs adds one there. The bouncer does not exist on a LAN
# box, so this needs the same guard that decided whether it was installed at
# all.
#
# Without it the run dies at the very end, after every task has succeeded, with
# "Could not find the requested service crowdsec-firewall-bouncer". Gated on
# crowdsec_manage rather than swallowed with failed_when, so a bouncer
# genuinely missing from a [vps] host is still an error.
- name: Restart CrowdSec bouncer
  ansible.builtin.service:
    name: "{{ crowdsec_firewall_bouncer_service }}"
    state: restarted
  when:
    - crowdsec_manage | bool
    # crowdsec_manage says this host *should* have CrowdSec; it does not say it
    # does. A [vpn] or [vps] host on a release packagecloud has not shipped for
    # yet has the switch on and no bouncer, so restarting one fails the run at
    # the very end - the same failure this guard was added for, one layer down.
    - crowdsec_suite_available | default(true) | bool
