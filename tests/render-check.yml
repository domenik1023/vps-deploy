---
# Renders the role's derived variables and asserts their shape.
#
# --syntax-check and ansible-lint both parse this repo happily while a Jinja
# expression still evaluates to the wrong *type* - a list that silently becomes
# a string, a dict that stops being valid JSON. Those only surface on a real
# host, usually as a service that will not start. This play catches them on a
# laptop, with no target and no side effects.
#
#   ansible-playbook tests/render-check.yml
#
# It deliberately reads roles/config/defaults/main.yml rather than restating the
# expressions, so it tests the real definitions.
- name: Check that the role's derived variables render to the right shapes
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../roles/config/defaults/main.yml
    - ../roles/alloy/defaults/main.yml
  vars:
    # Only present so defaults referencing it can be loaded; never used.
    vault_admin_password: "$6$placeholder"
    # Relative to this playbook. The Alloy config is a template rather than a
    # variable, so its assertions render it here instead of reading a value.
    alloy_template: ../roles/alloy/templates/config.alloy.j2

  tasks:
    - name: The cscli prefix must stay a list
      # If Ansible ever stops preserving the native type here, this becomes the
      # string "['docker', 'exec', ...]" and every delegated command breaks with
      # a confusing "No such file or directory".
      ansible.builtin.assert:
        that:
          - crowdsec_lapi_cscli is sequence
          - crowdsec_lapi_cscli is not string
          - crowdsec_lapi_cscli[-1] == 'cscli'
        success_msg: "crowdsec_lapi_cscli renders as {{ crowdsec_lapi_cscli }}"

    - name: The bouncer mode must follow the package variant
      # Package name, service name and backend mode are three different strings.
      ansible.builtin.assert:
        that:
          - crowdsec_firewall_bouncer_mode in ['iptables', 'nftables']
          - crowdsec_firewall_bouncer_mode in crowdsec_firewall_bouncer_package
        success_msg: "{{ crowdsec_firewall_bouncer_package }} -> mode={{ crowdsec_firewall_bouncer_mode }}"

    - name: The Docker daemon config must be a mapping that survives a JSON round trip
      ansible.builtin.assert:
        that:
          - docker_daemon_options is mapping
          - (docker_daemon_options | to_nice_json | from_json) == docker_daemon_options
          - docker_daemon_options['live-restore'] is boolean
          - docker_daemon_options['log-opts']['max-file'] is string

    - name: User namespace remapping must stay opt-in
      # Turning it on relocates Docker's data root and breaks every container
      # that bind-mounts the socket, so it should never become a default again.
      ansible.builtin.assert:
        that:
          - docker_userns_remap | length == 0

    - name: Chains applied to both address families must exist in both
      # iptables_chains is appended to the v4 *and* v6 lists by the bouncer, and
      # a chain it cannot find aborts startup. Docker-specific chains belong in
      # the v4-only list, which is probed before use.
      ansible.builtin.assert:
        that:
          - crowdsec_bouncer_iptables_chains | difference(['INPUT', 'OUTPUT', 'FORWARD']) | length == 0
        fail_msg: >-
          crowdsec_bouncer_iptables_chains may only hold chains that exist in
          iptables and ip6tables alike. Put anything Docker creates in
          crowdsec_bouncer_iptables_v4_chains instead.

    - name: Fail2ban must stay duller than CrowdSec's SSH scenarios
      # crowdsecurity/ssh-bf overflows at 6 failures and ssh-slow-bf at 11. A
      # lower fail2ban threshold bans first and starves CrowdSec of the events
      # it needs, which costs the fleet-wide decision.
      ansible.builtin.assert:
        that:
          - fail2ban_maxretry | int > 11
        fail_msg: >-
          fail2ban_maxretry ({{ fail2ban_maxretry }}) is at or below
          crowdsecurity/ssh-slow-bf's threshold of 11, so fail2ban will ban
          first and CrowdSec's SSH scenarios will rarely fire.

    - name: The base collection list must survive host overrides
      # crowdsec_collections is the floor every agent gets; hosts add to
      # crowdsec_collections_extra. If a host_vars file ever sets the base list
      # directly it replaces it wholesale, which silently drops sshd detection.
      ansible.builtin.assert:
        that:
          - "'crowdsecurity/linux' in crowdsec_collections"
          - "'crowdsecurity/iptables' in crowdsec_collections"
          - crowdsec_collections_extra is iterable
        fail_msg: >-
          Host-specific collections belong in crowdsec_collections_extra;
          crowdsec_collections is the base every agent needs.

    - name: The firewall log prefix must be safe to embed in before.rules
      # This string is written verbatim into a double-quoted --log-prefix
      # argument in ufw's before.rules, which iptables-restore parses. A stray
      # quote or newline there does not fail the play - it fails `ufw reload`,
      # and a failed reload leaves the firewall stopped with a default-ACCEPT
      # policy. The ACCEPT and "UFW AUDIT" checks are the two exclusions in
      # crowdsecurity/iptables-logs' filter: a prefix matching either makes the
      # parser silently discard every line it is meant to read.
      ansible.builtin.assert:
        that:
          - crowdsec_firewall_log_prefix | length > 0
          - crowdsec_firewall_log_prefix | length <= 29
          - crowdsec_firewall_log_prefix | regex_findall('["\n]') | length == 0
          - crowdsec_firewall_log_prefix is not search('ACCEPT')
          - crowdsec_firewall_log_prefix is not search('UFW AUDIT')
        fail_msg: >-
          crowdsec_firewall_log_prefix ({{ crowdsec_firewall_log_prefix }}) must
          be 1-29 characters, free of quotes and newlines, and must not contain
          "ACCEPT" or "UFW AUDIT" - crowdsecurity/iptables-logs filters both out.
        success_msg: "iptables LOG prefix renders as {{ crowdsec_firewall_log_prefix }}"

    - name: The CrowdSec whitelists must stay lists
      # Both are interpolated straight into the ip: and cidr: keys of a parser
      # whitelist. A bare string there yields a YAML scalar where CrowdSec
      # expects a sequence, and the whitelist is ignored - which only shows up
      # as a fleet-wide ban on an address that was supposed to be exempt.
      ansible.builtin.assert:
        that:
          - crowdsec_whitelist_ips is sequence
          - crowdsec_whitelist_ips is not string
          - crowdsec_whitelist_cidrs is sequence
          - crowdsec_whitelist_cidrs is not string

    - name: The reboot window must be a valid systemd calendar expression
      ansible.builtin.assert:
        that:
          - unattended_reboot_oncalendar is search('^[A-Za-z]{3} \\*-\\*-\\* [0-9]{2}:[0-9]{2}:[0-9]{2}$')
        fail_msg: >-
          Verify with `systemd-analyze calendar "{{ unattended_reboot_oncalendar }}"`.

    - name: The hostname pattern must accept inventory names and reject invalid ones
      # system_hostname is written to /etc/hostname and handed to hostnamectl,
      # which rejects an invalid name outright - and the task that would catch
      # it runs first in the play, so a bad pattern fails the run before the
      # admin user exists. Underscores are the case that matters: legal in an
      # inventory name, illegal in a hostname.
      ansible.builtin.assert:
        that:
          - valid_hostnames | reject('match', system_hostname_pattern) | list | length == 0
          - invalid_hostnames | select('match', system_hostname_pattern) | list | length == 0
        fail_msg: >-
          system_hostname_pattern no longer separates valid DNS names from
          invalid ones. It must accept {{ valid_hostnames | join(', ') }} and
          reject {{ invalid_hostnames | join(', ') }}.
      vars:
        valid_hostnames: [vps-pangolin, vps-docker, testvm, a, vps.example.com]
        invalid_hostnames: ["crowdsec_master", "-leading", "trailing-", "has space", "", "double..dot"]

    - name: Every Alloy signal endpoint must derive from the one ingest hostname
      # The whole point of alloy_ingest_base is that switching a group between
      # the LAN and public names is one line in group_vars/vps.yml. An endpoint
      # that stops deriving from it keeps pointing at the old hostname, and an
      # off-site host cannot even resolve ingest.net.d1023.de - the agent then
      # retries forever and the only symptom is telemetry that never arrives.
      ansible.builtin.assert:
        that:
          - alloy_ingest_base is search('^https://')
          - alloy_loki_endpoint == alloy_ingest_base ~ '/loki/api/v1/push'
          - alloy_prom_endpoint == alloy_ingest_base ~ '/api/v1/write'
          # Base URLs, not paths: otelcol.exporter.otlphttp appends /v1/traces
          # and pyroscope.write appends /push.v1.PusherService/Push themselves.
          - alloy_tempo_endpoint == alloy_ingest_base
          - alloy_pyroscope_endpoint == alloy_ingest_base
        fail_msg: >-
          The four alloy_*_endpoint values must derive from alloy_ingest_base
          ({{ alloy_ingest_base }}), which must be an https:// URL. Override one
          individually only to send a single signal somewhere else.
        success_msg: "Alloy endpoints derive from {{ alloy_ingest_base }}"

    - name: Alloy's listeners must stay on loopback
      # All three are unauthenticated and Alloy has no credential checking to
      # turn on, so binding any of them wider publishes a trace sink, a profile
      # sink and a UI exposing the config structure. UFW's default-deny is the
      # only thing between them and the internet on these hosts, and Docker
      # publishing a port is enough to bypass that.
      ansible.builtin.assert:
        that:
          - alloy_otlp_bind == '127.0.0.1'
          - alloy_profiles_bind == '127.0.0.1'
          - alloy_ui_bind == '127.0.0.1'
          # Alloy already defaults to 127.0.0.1:12345, so the flag is omitted
          # while the bind address matches. Emitting it takes the upstream
          # role's preflight down a path that needs ansible.utils.ipaddr, which
          # is not in requirements.yml.
          - "'--disable-reporting' in alloy_custom_args"
          - alloy_custom_args is not search('listen-addr')
        fail_msg: >-
          alloy_otlp_bind, alloy_profiles_bind and alloy_ui_bind must stay on
          127.0.0.1. Reach the UI over an SSH tunnel instead
          (ssh -L 12345:localhost:12345 <host>); widening alloy_ui_bind also
          means adding ansible.utils to requirements.yml.

    - name: Whole-host eBPF profiling must have the privileges and the output it needs
      # pyroscope.ebpf is documented as root-only, and it forwards to the
      # pyroscope.write block that alloy_enable_profiles controls. Get either
      # wrong and one component sits in an error state while the rest of the
      # agent carries on, so nothing looks broken and no profiles arrive.
      ansible.builtin.assert:
        that:
          - not alloy_enable_ebpf | bool or alloy_service_user == 'root'
          - not alloy_enable_ebpf | bool or alloy_enable_profiles | bool
        fail_msg: >-
          alloy_enable_ebpf needs alloy_service_user=root and
          alloy_enable_profiles=true. The host also needs /sys/kernel/tracing
          readable and a writable /tmp/symb-cache - see docs/alloy.md.

    - name: Extra log paths must stay a list of path/job mappings
      # Interpolated one per line into local.file_match's path_targets. A bare
      # string, or an entry missing `job`, renders a block that either fails
      # Alloy's parser at startup or ships the lines under an empty job label,
      # where nothing in Grafana is looking for them. A list and not a dict so
      # the rendered file keeps a stable order: unordered output makes the
      # config task report `changed` on every run and restart Alloy with it.
      ansible.builtin.assert:
        that:
          - alloy_extra_log_paths is sequence
          - alloy_extra_log_paths is not string
          - alloy_extra_log_paths is not mapping
          - alloy_extra_log_paths | rejectattr('path', 'defined') | list | length == 0
          - alloy_extra_log_paths | rejectattr('job', 'defined') | list | length == 0
        fail_msg: >-
          alloy_extra_log_paths must be a list of mappings, each with a `path`
          glob and a `job`, e.g.
          [{ path: "/tmp/logs/*.log", job: "python" }].

    - name: Every access log must name a known format and an absolute path
      # `format` selects the field map, and an unknown one is an undefined-key
      # error at render time rather than anything subtle. `path` is
      # interpolated into local.file_match's __path__, where a relative path
      # resolves against Alloy's working directory instead of failing, so the
      # pipeline sits there matching nothing. `job` is interpolated into the
      # component names, where anything but an Alloy identifier is a parse
      # error that stops the agent on its next restart.
      ansible.builtin.assert:
        that:
          - alloy_access_logs is sequence
          - alloy_access_logs is not string
          - alloy_access_logs is not mapping
          - alloy_access_logs | rejectattr('path', 'defined') | list | length == 0
          - alloy_access_logs | map(attribute='path') | reject('match', '^/') | list | length == 0
          - alloy_access_logs | map(attribute='format', default='') | reject('in', alloy_access_log_formats) | list | length == 0
          - alloy_access_logs | map(attribute='job', default='x') | reject('match', '^[a-zA-Z_][a-zA-Z0-9_]*$') | list | length == 0
        fail_msg: >-
          alloy_access_logs must be a list of mappings, each with an absolute
          `path` and a `format` from
          {{ alloy_access_log_formats.keys() | list | join(', ') }}, e.g.
          [{ path: /mnt/docker/pangolin/logs/access.log, format: traefik }].

    - name: Each access log format must map fields and keep its labels bounded
      # `labels` become real Loki labels, and every distinct value of one is a
      # new stream. Promoting an unbounded field - a path, a client IP - is the
      # quickest way to make Loki miserable, and it is the kind of edit that
      # looks harmless in review. The names are also interpolated into Alloy
      # identifiers, and every label has to be a field that was extracted.
      ansible.builtin.assert:
        that:
          - alloy_access_log_formats is mapping
          - fmt.timestamp_field | length > 0
          - fmt.timestamp_format | length > 0
          - fmt.fields is sequence
          - fmt.fields is not mapping
          - fmt.fields | rejectattr('name', 'defined') | list | length == 0
          - fmt.fields | rejectattr('json', 'defined') | list | length == 0
          - fmt.fields | map(attribute='name') | reject('match', '^[a-zA-Z_][a-zA-Z0-9_]*$') | list | length == 0
          - fmt.fields | map(attribute='name') | unique | list | length == fmt.fields | length
          - fmt.labels | length <= 2
          - fmt.labels | difference(fmt.fields | map(attribute='name') | list) | length == 0
        fail_msg: >-
          alloy_access_log_formats.{{ item }} must map every field it names and
          promote at most two bounded ones to labels. Everything else belongs
          in structured metadata, which is queryable without creating a Loki
          stream per distinct value.
      loop: "{{ alloy_access_log_formats.keys() | list }}"
      vars:
        fmt: "{{ alloy_access_log_formats[item] }}"

    - name: Extra scrape targets must name a valid component and a bare host port
      # `name` is interpolated straight into the block name, where anything but
      # an Alloy identifier is a parse error that stops the agent dead on the
      # next restart. `address` fills __address__, which is a host:port and not
      # a URL - a scheme pasted in there scrapes a nonexistent host and shows up
      # only as a target that never comes up.
      ansible.builtin.assert:
        that:
          - alloy_extra_scrape_targets is sequence
          - alloy_extra_scrape_targets is not string
          - alloy_extra_scrape_targets is not mapping
          - alloy_extra_scrape_targets | map(attribute='name', default='') | reject('match', '^[a-zA-Z_][a-zA-Z0-9_]*$') | list | length == 0
          - alloy_extra_scrape_targets | map(attribute='address', default='') | reject('match', '^[^\\s/]+:[0-9]+$') | list | length == 0
        fail_msg: >-
          alloy_extra_scrape_targets must be a list of mappings, each with a
          `name` that is a valid Alloy identifier and an `address` of the form
          host:port - no scheme, no path, e.g.
          [{ name: "traefik", address: "127.0.0.1:8082" }].

    - name: The rendered Alloy config must survive being templated a second time
      # grafana.grafana.alloy writes alloy_config with ansible.builtin.template,
      # so whatever this repo renders passes through Jinja again on the way to
      # /etc/alloy/config.alloy. Anything that reaches that second pass holding
      # an opening Jinja delimiter is evaluated and discarded silently - the
      # file lands short of a pipeline and Alloy starts perfectly happily
      # without it.
      #
      # The delimiters are concatenated a character at a time on purpose: a
      # literal opening delimiter written out in this file is read by the very
      # lexer being tested, and the task fails to parse instead of running.
      #
      # Both the default render and the everything-on one are checked: the
      # blocks most likely to reintroduce a delimiter are the optional ones,
      # and those are exactly the blocks a default render never reaches. The
      # Traefik pipeline's nested braces are the current worst offender.
      ansible.builtin.assert:
        that:
          - alloy_rendered.count('{' ~ '{') == 0
          - alloy_rendered.count('{' ~ '%') == 0
          - alloy_rendered.count('{' ~ '#') == 0
          - alloy_everything.count('{' ~ '{') == 0
          - alloy_everything.count('{' ~ '%') == 0
          - alloy_everything.count('{' ~ '#') == 0
        fail_msg: >-
          The rendered Alloy config still contains a Jinja opening delimiter,
          which grafana.grafana.alloy's own templating will consume. Escaping
          it for this pass is not enough; it has to survive both.
      vars:
        alloy_rendered: "{{ lookup('ansible.builtin.template', alloy_template) }}"
        alloy_everything_vars:
          alloy_enable_ebpf: true
          alloy_access_logs:
            - { path: /mnt/docker/pangolin/logs/access.log, format: traefik, drop_paths: ["^/health$"] }
            - { path: /mnt/docker/caddy/logs/access.log, format: caddy }
          alloy_extra_log_paths:
            - { path: "/tmp/logs/*.log", job: "python" }
          alloy_extra_scrape_targets:
            - { name: "traefik", address: "127.0.0.1:8082" }
        alloy_everything: "{{ lookup('ansible.builtin.template', alloy_template, template_vars=alloy_everything_vars) }}"

    - name: Every host_vars file must render a config Alloy can parse
      # The assertions above read this role's defaults, which is where the
      # shapes are defined - but a host_vars file can put anything it likes in
      # the same variables, and nothing here used to look at those. That gap is
      # not theoretical: `name: "instance/traefik"` in a host_vars scrape
      # target passed CI green and rendered
      # `prometheus.scrape "instance/traefik"`, which Alloy rejects outright
      # with "expected block label to be a valid identifier". The agent then
      # fails to start on that host and nothing before this point noticed.
      #
      # So render each host for real and check the two properties that make a
      # config parseable at all: every block label is an Alloy identifier, and
      # nothing survived holding a Jinja delimiter.
      ansible.builtin.assert:
        that:
          - labels | reject('match', '^[a-zA-Z_][a-zA-Z0-9_]*$') | list | length == 0
          - rendered.count('{' ~ '{') == 0
          - rendered.count('{' ~ '%') == 0
          # One naming convention across every signal. The template owns the
          # prefix so a host_vars `job` cannot opt out of it - a job label that
          # does not start with integrations/ is invisible to every dashboard
          # and every query in docs/alloy.md, and it fails by showing nothing
          # rather than by erroring.
          - jobs | reject('match', '^integrations/') | list | length == 0
          # Every address Alloy listens on. All three receivers are
          # unauthenticated and there is no option that changes that, so what
          # keeps them safe is the address they bind. Loopback is the default;
          # a Docker bridge gateway is the one sanctioned widening, for a
          # sender that genuinely cannot reach loopback - a container in
          # another container's network namespace. 0.0.0.0 is the mistake this
          # catches, and it would also collide with the loopback receiver.
          - binds | reject('match', private_address) | list | length == 0
        fail_msg: >-
          host_vars/{{ item | basename }} renders a config Alloy cannot parse,
          or one that breaks the job naming convention.
          Invalid block labels:
          {{ labels | reject('match', '^[a-zA-Z_][a-zA-Z0-9_]*$') | list | join(', ') | default('none', true) }}.
          Job labels missing the integrations/ prefix:
          {{ jobs | reject('match', '^integrations/') | list | join(', ') | default('none', true) }}.
          Listeners bound outside a private range:
          {{ binds | reject('match', private_address) | list | join(', ') | default('none', true) }}.
          A component label is an identifier - letters, digits and underscores,
          not starting with a digit - so it cannot hold a slash, a dot or a
          dash. `job` on a scrape target, a log path or an access log is the
          suffix only; the template adds integrations/ itself.
        success_msg: >-
          {{ item | basename }} renders {{ labels | length }} components,
          jobs: {{ jobs | unique | sort | join(', ') }}
      loop: "{{ query('ansible.builtin.fileglob', alloy_host_vars) | sort }}"
      loop_control:
        label: "{{ item | basename }}"
      vars:
        alloy_host_vars: ../host_vars/*.yml
        host_overrides: "{{ lookup('ansible.builtin.file', item) | from_yaml | default({}, true) }}"
        rendered: "{{ lookup('ansible.builtin.template', alloy_template, template_vars=host_overrides) }}"
        # Every `component.kind "label" {` at the start of a line.
        labels: "{{ rendered | regex_findall('^[a-z_][a-z0-9_.]* \"([^\"]*)\" \\{', multiline=True) }}"
        # Every job label a host can influence: `job_name =` on a scrape, and
        # `job =` inside a file_match target mapping. The Docker relabel rule
        # sets its job through `replacement` instead, but that one is a literal
        # in the template rather than anything host_vars can reach.
        #
        # Kept on one line: as a folded scalar the concatenation silently
        # yields an empty list, and an assertion over an empty list passes
        # whatever the config says.
        jobs: "{{ (rendered | regex_findall('job_name\\s*=\\s*\"([^\"]*)\"')) + (rendered | regex_findall('\\bjob\\s*=\\s*\"([^\"]*)\"')) }}"
        # Every address a receiver binds: the OTLP grpc/http one-liners and the
        # Pyroscope listener. Deliberately not `endpoint =` in general - that
        # also names the outbound loki.write and remote_write URLs.
        binds: "{{ (rendered | regex_findall('(?:grpc|http) \\{ endpoint = \"([^\":]*):')) + (rendered | regex_findall('listen_address = \"([^\"]*)\"')) }}"
        private_address: '^(10\.|192\.168\.|127\.|172\.(1[6-9]|2[0-9]|3[01])\.)'

    - name: Every host UFW allow rule must be scoped to a private source
      # Same gap as the task above, one variable over: ufw_allow_rules is
      # host-settable and its default is empty, so an assertion naming it up
      # here would check nothing. These rules exist to let a LAN back in past
      # default-deny, and both fields that keep them bounded are optional in
      # the task that applies them - an entry with no `src` opens its ports on
      # every address the host holds, the public one included, and an entry
      # naming a public src does the same for whoever it names. Neither fails
      # the play; both quietly widen a firewall. A genuinely public rule would
      # be a deliberate decision, so it should have to change this assertion
      # rather than ride in on a copied line.
      ansible.builtin.assert:
        that:
          - host_rules is sequence
          - host_rules is not string
          - host_rules | rejectattr('src', 'defined') | list | length == 0
          - bad_sources | length == 0
        fail_msg: >-
          host_vars/{{ item | basename }} has a ufw_allow_rules entry with no
          src, or with a src outside RFC 1918:
          {{ bad_sources | join(', ') | default('none', true) }}.
        success_msg: >-
          {{ item | basename }}: {{ host_rules | length }} UFW allow rule(s),
          sources: {{ host_rules | map(attribute='src', default='(none)') | join(', ') | default('none', true) }}
      loop: "{{ query('ansible.builtin.fileglob', ufw_host_vars) | sort }}"
      loop_control:
        label: "{{ item | basename }}"
      vars:
        ufw_host_vars: ../host_vars/*.yml
        host_file: "{{ lookup('ansible.builtin.file', item) | from_yaml | default({}, true) }}"
        host_rules: "{{ host_file.ufw_allow_rules | default([], true) }}"
        bad_sources: "{{ host_rules | map(attribute='src', default='(none)') | reject('match', private_address) | list }}"
        private_address: '^(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.)'

    - name: The pipeline toggles must actually add and remove pipelines
      # Each toggle exists for a failure it prevents, and a broken conditional
      # fails quietly in the direction that matters: a host without Docker
      # keeps the container blocks and logs socket errors continuously, and a
      # host that never asked for eBPF loads a kernel program.
      ansible.builtin.assert:
        that:
          - alloy_default is search('prometheus.exporter.cadvisor')
          - alloy_default is search('loki.source.journal')
          - alloy_default is search('otelcol.receiver.otlp')
          - alloy_default is search('pyroscope.receive_http')
          - alloy_default is not search('pyroscope.ebpf')
          - alloy_no_docker is not search('cadvisor')
          - alloy_no_docker is not search('discovery.docker')
          - alloy_ebpf is search('pyroscope.ebpf')
          - alloy_default is not search('prometheus.scrape "traefik"')
          - alloy_scrape is search('prometheus.scrape "traefik"')
          - alloy_scrape is search('job_name        = "integrations/traefik"')
          # The node job name is what every dashboard and every query in
          # docs/alloy.md filters on, and renaming it silently orphans them
          # all - the metrics keep arriving under a name nothing looks for.
          - alloy_default is search('job_name        = "integrations/node_exporter"')
          # An access log pipeline appears only when a host names one, and
          # naming one has to bring the parser with it: the file tailed without
          # loki.process ships JSON blobs Loki cannot break into fields.
          - alloy_default is not search('loki.process')
          - alloy_traefik is search('loki.process "access_traefik"')
          - alloy_traefik is search('stage.structured_metadata')
          - alloy_traefik is search('trace_id')
          - alloy_traefik is not search('stage.drop')
          # Each format renders its own pipeline, and two on one host must not
          # collide - the component names are what keep them apart.
          - alloy_both is search('loki.process "access_traefik"')
          - alloy_both is search('loki.process "access_caddy"')
          - alloy_both is search('request.uri')
          - alloy_traefik_dropping is search('stage.drop')
          - alloy_traefik_dropping is search('expression          = "\^/health\$"')
          # Alloy's strings take Go's escape sequences, so the backslash in an
          # everyday regex is an "unknown escape sequence" that fails the whole
          # config file - not just the stage - and stops the agent on its next
          # restart. The template runs each expression through to_json, which
          # doubles it. Verified against `alloy validate` from 1.18.1.
          - alloy_escaped_drop in alloy_traefik_dropping
        fail_msg: >-
          A pipeline toggle in config.alloy.j2 no longer adds or removes the
          block it names. Render it by hand to compare:
          ansible-playbook tests/render-check.yml -vvv
      vars:
        alloy_default: "{{ lookup('ansible.builtin.template', alloy_template) }}"
        alloy_no_docker: "{{ lookup('ansible.builtin.template', alloy_template, template_vars={'alloy_enable_docker': false}) }}"
        alloy_ebpf: "{{ lookup('ansible.builtin.template', alloy_template, template_vars={'alloy_enable_ebpf': true}) }}"
        alloy_probe_targets:
          - name: traefik
            address: 127.0.0.1:8082
        alloy_scrape: "{{ lookup('ansible.builtin.template', alloy_template, template_vars={'alloy_extra_scrape_targets': alloy_probe_targets}) }}"
        alloy_probe_traefik:
          - { path: /mnt/docker/pangolin/logs/access.log, format: traefik }
        alloy_traefik: "{{ lookup('ansible.builtin.template', alloy_template, template_vars={'alloy_access_logs': alloy_probe_traefik}) }}"
        alloy_probe_both:
          - { path: /mnt/docker/pangolin/logs/access.log, format: traefik }
          - { path: /mnt/docker/caddy/logs/access.log, format: caddy }
        alloy_both: "{{ lookup('ansible.builtin.template', alloy_template, template_vars={'alloy_access_logs': alloy_probe_both}) }}"
        # Single-quoted YAML, which passes backslashes through untouched - so
        # this is one backslash, exactly what a host_vars entry produces. Do
        # not write it as a Jinja string literal inside the lookup below: that
        # unescapes the pair and feeds the template a value already doubled,
        # which makes this test pass whether the template escapes or not.
        alloy_probe_dropping:
          - path: /mnt/docker/pangolin/logs/access.log
            format: traefik
            drop_paths:
              - '^/health$'
              - '^/favicon\.ico$'
        # The expected output, likewise single-quoted: two backslashes, which
        # is what Alloy reads back as the one the regex needs.
        alloy_escaped_drop: 'expression          = "^/favicon\\.ico$"'
        alloy_traefik_dropping: "{{ lookup('ansible.builtin.template', alloy_template, template_vars={'alloy_access_logs': alloy_probe_dropping}) }}"
