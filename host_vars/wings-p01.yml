# A [vpn] host. See docs/wireguard.md for the OPNsense side and for what to
# check before the first run.
#
# Originally provisioned against a UniFi UDM as the WireGuard server; migrated
# to OPNsense (78.47.74.24) below. The host already has a generated keypair
# from that first provisioning - see wg_generate_key at the bottom - so this
# migration is a re-registration on the new server, not a fresh bootstrap.

# The key this host accepts. Only needed when it differs from the one the rest
# of the fleet uses - a provider that injects its own key for the first boot,
# say. It overrides --private-key on the command line, so the usual invocation
# keeps working for every other host.
# ansible_ssh_private_key_file: ~/.ssh/provider-bootstrap

# Reach it on the public address for the first run. The hardening tasks move
# sshd to ssh_port and then deny ssh_old_port, so set this to 22822 afterwards
# - and keep using the public address, not the tunnel address: the tunnel is
# built by the run, so on a bootstrap run it does not exist yet.
ansible_host: "{{ vpn_ip | default('141.5.110.173') }}"
ansible_port: 22822
ansible_user: cloud

# Set to route future Ansible runs through the tunnel instead of the public
# address above - see docs/wireguard.md. Leave unset for now: the tunnel just
# went through repeated handshake failures during initial setup, and there is
# no fallback to the public address if it drops again while this is set.
# vpn_ip: 10.99.0.11

# --- The tunnel ---
# Reassigned for the move from the UDM to OPNsense - was 192.168.9.20/32,
# OPNsense's own addressing (10.99.0.0/24) uses this instead. Must match
# exactly what gets registered as this peer's Allowed IPs on OPNsense.
wg_address: 10.99.0.11/32

# There is no LAN resolver reachable from here any more - OPNsense does not
# route this peer to the home LAN, only to the internet. A public resolver,
# matching OPNsense's own peer_dns setting.
wg_dns:
  - 9.9.9.9

# OPNsense's WireGuard instance, not the old UDM server.
wg_peer_public_key: "5s+J6ldEy49s6X6giulMtqKJCeTHP8LObhz2KTwyUCQ="
wg_peer_endpoint: "78.47.74.24:51820"

# Secrets. Never in plain text here - encrypt in place:
#
#   ansible-vault encrypt_string --name wg_preshared_key '<PresharedKey>'
#
# and paste what it prints. Only needed if the OPNsense peer entry has a
# preshared key; leave it out otherwise. No wg_private_key here - the private
# key is generated on the host itself, never taken from anywhere else.
#
# wg_preshared_key: !vault |
#           $ANSIBLE_VAULT;1.1;AES256
#           ...

# Only if the VPS reaches the internet through provider NAT, so its public
# address is not on any local interface and cannot be matched against
# ansible_host. `ip -4 addr` on the host names the right one.
# wg_wan_interface: ens3

# OPNsense never hands out a client private key, so this host makes its own -
# already done, from when this pointed at the UDM. Re-run against this host to
# see the same public key printed again (the debug task runs regardless of
# whether the key is freshly generated), so it can be registered as a new peer
# on OPNsense before the play is run for real - see docs/wireguard.md.
wg_generate_key: true
