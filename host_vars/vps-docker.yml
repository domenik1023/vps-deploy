# Internet-facing VPS: full hardening plus the CrowdSec agent and bouncer.
ansible_host: 91.132.146.192

# Port 22 for the first (bootstrap) run only. The hardening tasks move sshd to
# ssh_port and then deny ssh_old_port, so set this to 22822 afterwards.
ansible_port: 22822

# Per-host overrides go here, for example:
# ssh_port: 22822
# crowdsec_firewall_bouncer_package: crowdsec-firewall-bouncer-nftables

# Caddy's access log, parsed rather than shipped raw - see docs/alloy.md for
# the Caddy side, which has to be done first: `log { output file ... }` with
# `format json { time_format rfc3339_nano }`, writing somewhere the host can
# see. Until that file exists local.file_match simply matches nothing, so
# landing this ahead of the Caddy change is harmless.
#
# Confirm the path against the bind mount in the Caddy compose file before the
# first run; it follows the same /mnt/docker/<stack>/logs convention as
# vps-pangolin.
alloy_access_logs:
  - path: /mnt/docker/caddy/logs/access.log
    format: caddy
    drop_paths:
      - "^/favicon\\.ico$"

# Caddy's Prometheus endpoint. Deliberately NOT the admin endpoint on :2019:
# that one is unauthenticated and can rewrite Caddy's running config, so it
# stays inside the container. This is a dedicated `metrics` route instead, and
# it has to be published to loopback - see docs/alloy.md.
#
# Until Caddy actually serves it, this target reports up == 0 rather than
# nothing at all, so do the Caddy side promptly or comment this back out.
alloy_extra_scrape_targets:
  - { name: "caddy", address: "127.0.0.1:2020" }

crowdsec_acquisitions:
  caddy-docker:
    source: docker
    container_name:
      - vps-docker-caddy-caddy-1          # exact container name, as shown by `docker ps`
    labels:
      type: caddy

# Added to the base list in the role defaults, not replacing it.
crowdsec_collections_extra:
  # Parser for Caddy's JSON logs, and the generic HTTP scenarios it pulls in
  # via crowdsecurity/base-http-scenarios: scanning, probing, brute force.
  - crowdsecurity/caddy
  # Exploitation attempts against known CVEs. A different signal from the
  # generic scenarios above, on the same log source.
  - crowdsecurity/http-cve
  # Whitelists legitimate crawlers at the postoverflow stage. Without it an
  # aggressive Googlebot crawl can look like scanning, and the resulting ban
  # would propagate from the central LAPI to every host in the fleet.
  - crowdsecurity/whitelist-good-actors
