# Internet-facing VPS: full hardening plus the CrowdSec agent and bouncer.
ansible_host: 91.132.146.192

# Port 22 for the first (bootstrap) run only. The hardening tasks move sshd to
# ssh_port and then deny ssh_old_port, so set this to 22822 afterwards.
ansible_port: 22822

# Per-host overrides go here, for example:
# ssh_port: 22822
# crowdsec_firewall_bouncer: crowdsec-firewall-bouncer-nftables

crowdsec_acquisitions:
  caddy-docker:
    source: docker
    container_name:
      - vps-docker-caddy-caddy-1          # exact container name, as shown by `docker ps`
    labels:
      type: caddy

crowdsec_collections:
  - crowdsecurity/linux   # keep - overriding replaces the whole list
  - crowdsecurity/caddy
