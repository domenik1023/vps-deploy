# Internet-facing VPS: full hardening plus the CrowdSec agent and bouncer.
ansible_host: 202.61.230.55

# Port 22 for the first (bootstrap) run only. The hardening tasks move sshd to
# ssh_port and then deny ssh_old_port, so set this to 22822 afterwards.
ansible_port: 22822

# Per-host overrides go here, for example:
# ssh_port: 22822
# crowdsec_firewall_bouncer_package: crowdsec-firewall-bouncer-nftables

# Traefik's access log. Not an alloy_extra_log_paths entry: that ships lines
# raw, and this one is parsed, which is what gives the lines their real
# timestamps and the trace_id that makes them clickable through to Tempo.
# Requires `accessLog.format: json` in Traefik - see docs/alloy.md.
alloy_traefik_access_log: "/mnt/docker/pangolin/logs/access.log"

alloy_extra_scrape_targets:
  - { name: "traefik", address: "127.0.0.1:8082" }
