[defaults]
host_key_checking = False

# Keep auto-discovery but drop the per-host warning about the discovered
# interpreter. Targets are Ubuntu, where /usr/bin/python3 is always the right
# answer; pin ansible_python_interpreter per host if that ever stops holding.
interpreter_python = auto_silent

# Becomes the default in ansible-core 2.24. Facts are read as
# ansible_facts['name'] everywhere in this repo, so opting in now keeps a
# stray ansible_<fact> reference from silently working until the switch.
inject_facts_as_vars = False

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ControlMaster=auto -o ControlPersist=60s
# Reuse one SSH session per host across tasks instead of opening a new
# connection each time. Without this, plays trip UFW's `limit` rule on the
# SSH port (>6 new conns/30s -> REJECT, seen as "Connection refused").
pipelining = True
