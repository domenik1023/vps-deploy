[defaults]
host_key_checking = False

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ControlMaster=auto -o ControlPersist=60s
# Reuse one SSH session per host across tasks instead of opening a new
# connection each time. Without this, plays trip UFW's `limit` rule on the
# SSH port (>6 new conns/30s -> REJECT, seen as "Connection refused").
pipelining = True
